[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsod-analyzer"
version = "0.9.1"
description = "Windows Error Checker: Blue Screen of Death analyzer with event log scanning, hardware diagnostics, and driver management"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "H.Knight"}]
keywords = ["bsod", "windows", "error", "diagnostics", "hardware", "driver", "crash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/yourusername/bsod-analyzer"
Repository = "https://github.com/yourusername/bsod-analyzer.git"
Issues = "https://github.com/yourusername/bsod-analyzer/issues"

[project.scripts]
bsod-analyzer = "bsod_ui:main"

[tool.setuptools]
py-modules = ["bsod_core", "bsod_ui", "driver_updates"]
